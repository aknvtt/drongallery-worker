name: selftest

# Renders a synthetic 4K clip with the real worker code and checks resolution, frame count, colour tags and quality.
# Does not use any secret and never talks to the gallery site or to Drive.
on:
  workflow_dispatch:
    inputs:
      sweep:
        description: "Compare several x264 CRF values on clips with different noise (informational, never fails)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  video:
    if: ${{ !inputs.sweep }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg and exiftool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libimage-exiftool-perl
      - run: npm ci --omit=dev
      - run: node selftest.mjs

  sweep:
    if: ${{ inputs.sweep }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        noise: [3]
        crf: [18]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ffmpeg and exiftool
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg libimage-exiftool-perl
      - run: npm ci --omit=dev
      - run: node selftest.mjs
        env:
          SELFTEST_SOFT: "1"
          SELFTEST_DIAG: "1"
          SELFTEST_NOISE: ${{ matrix.noise }}
          WORKER_CRF: ${{ matrix.crf }}
